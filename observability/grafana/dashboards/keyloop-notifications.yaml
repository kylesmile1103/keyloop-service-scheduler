apiVersion: dashboard.grafana.app/v1
kind: Dashboard
metadata:
  name: keyloop-notifications
  annotations:
    grafana.app/folder: keyloop-service-scheduler
spec:
  title: Keyloop Scheduler - Notifications
  description: Transactional outbox health, throughput and send latency. The G2 backlog gauges are declared in Infrastructure InfrastructureTelemetry.cs;
    they are not approximated with counters.
  tags:
  - keyloop
  - scheduler
  timezone: browser
  schemaVersion: 39
  version: 1
  editable: false
  graphTooltip: 1
  refresh: 1m
  time:
    from: now-6h
    to: now
  timepicker: {}
  annotations:
    list: []
  links:
  - title: Booking engine overview
    type: link
    url: /d/keyloop-booking-engine?${env:queryparam}&var-namespace=${namespace}&var-ds_metrics=${ds_metrics}&var-ds_logs=${ds_logs}&var-ds_traces=${ds_traces}
    keepTime: true
    includeVars: false
    targetBlank: false
  - title: API health
    type: link
    url: /d/keyloop-api-health?${env:queryparam}&var-namespace=${namespace}&var-ds_metrics=${ds_metrics}&var-ds_logs=${ds_logs}&var-ds_traces=${ds_traces}
    keepTime: true
    includeVars: false
    targetBlank: false
  - title: Frontend
    type: link
    url: /d/keyloop-frontend?${env:queryparam}&var-namespace=${namespace}&var-ds_metrics=${ds_metrics}&var-ds_logs=${ds_logs}&var-ds_traces=${ds_traces}
    keepTime: true
    includeVars: false
    targetBlank: false
  templating:
    list:
    - name: ds_metrics
      label: Metrics datasource
      type: datasource
      query: prometheus
      # Excludes Grafana Cloud's internal usage and cardinality sources.
      regex: /^(?!.*(usage|cardinality)).*$/
      refresh: 1
      options: []
      multi: false
      includeAll: false
    - name: ds_logs
      label: Logs datasource
      type: datasource
      query: loki
      # Grafana Cloud stacks also hold internal Loki sources (alert state history, usage insights) that sort first.
      regex: /^(?!.*(alert-state-history|usage-insights)).*$/
      refresh: 1
      options: []
      multi: false
      includeAll: false
    - name: ds_traces
      label: Traces datasource
      type: datasource
      query: tempo
      refresh: 1
      options: []
      multi: false
      includeAll: false
    - name: namespace
      type: constant
      query: keyloop-scheduler
      hide: 2
    - name: service
      label: Service
      type: textbox
      query: api
      current:
        text: api
        value: api
      options: []
    - name: env
      label: Environment
      type: query
      datasource:
        type: prometheus
        uid: ${ds_metrics}
      query:
        query: label_values(target_info{job="${namespace}/${service}"}, deployment_environment_name)
        refId: env
      definition: label_values(target_info{job="${namespace}/${service}"}, deployment_environment_name)
      refresh: 2
      sort: 1
      multi: true
      includeAll: true
      allValue: .*
      current:
        text: Production
        value: Production
      options: []
    - name: kind
      label: Kind
      type: custom
      query: BookingConfirmation,Cancellation
      multi: true
      includeAll: true
      allValue: .*
      current:
        text: All
        value: $__all
      options:
      - text: All
        value: $__all
        selected: true
      - text: BookingConfirmation
        value: BookingConfirmation
        selected: false
      - text: Cancellation
        value: Cancellation
        selected: false
  panels:
  - id: 1
    title: Dead letters in range, must be 0
    description: Production dispatch is disabled (Enabled=false, Provider=None) until the Cloudflare adapter/configuration lands; outbox rows are still written. Terminal
      failure after retries or expired leases; investigate event 1302 NotificationFailed. Empty or 0 is healthy. Counts a series' first export, like the dead-letter alert; a lower bound
      after a restart in the range.
    type: stat
    gridPos:
      x: 0
      y: 0
      w: 8
      h: 4
    datasource:
      type: prometheus
      uid: ${ds_metrics}
    interval: 1m
    fieldConfig:
      defaults:
        unit: short
        thresholds:
          mode: absolute
          steps:
          - color: green
            value: null
          - color: red
            value: 1
      overrides: []
    targets:
    - datasource:
        type: prometheus
        uid: ${ds_metrics}
      editorMode: code
      expr: sum((increase(scheduler_notifications_failed_total{job="${namespace}/${service}", deployment_environment_name=~"${env:regex}", kind=~"${kind:regex}"}[$__range])
        and scheduler_notifications_failed_total{job="${namespace}/${service}", deployment_environment_name=~"${env:regex}", kind=~"${kind:regex}"} offset $__range)
        or (max_over_time(scheduler_notifications_failed_total{job="${namespace}/${service}", deployment_environment_name=~"${env:regex}", kind=~"${kind:regex}"}[$__range])
        unless scheduler_notifications_failed_total{job="${namespace}/${service}", deployment_environment_name=~"${env:regex}", kind=~"${kind:regex}"} offset $__range))
        or vector(0)
      legendFormat: ''
      instant: true
      range: false
      format: time_series
      exemplar: false
      refId: A
      interval: 1m
    options:
      colorMode: background
      graphMode: none
      textMode: auto
      reduceOptions:
        calcs:
        - lastNotNull
        fields: ''
        values: false
  - id: 2
    title: Sent in range
    description: 'Production dispatch is disabled (Enabled=false, Provider=None) until the Cloudflare adapter/configuration lands; outbox rows are still written.
      Sender-accepted messages, not proof of inbox delivery. Approximate: the value a series carries at its first export is not counted.'
    type: stat
    gridPos:
      x: 8
      y: 0
      w: 8
      h: 4
    datasource:
      type: prometheus
      uid: ${ds_metrics}
    interval: 1m
    fieldConfig:
      defaults:
        unit: short
        thresholds:
          mode: absolute
          steps:
          - color: green
            value: null
      overrides: []
    targets:
    - datasource:
        type: prometheus
        uid: ${ds_metrics}
      editorMode: code
      expr: sum(increase(scheduler_notifications_sent_total{job="${namespace}/${service}", deployment_environment_name=~"${env:regex}", kind=~"${kind:regex}"}[$__range]))
        or vector(0)
      legendFormat: ''
      instant: true
      range: false
      format: time_series
      exemplar: false
      refId: A
      interval: 1m
    options:
      colorMode: background
      graphMode: none
      textMode: auto
      reduceOptions:
        calcs:
        - lastNotNull
        fields: ''
        values: false
  - id: 3
    title: Retries in range
    description: 'Production dispatch is disabled (Enabled=false, Provider=None) until the Cloudflare adapter/configuration lands; outbox rows are still written.
      Scheduled retries, not an extra enqueued message; event 1301 NotificationRetried. Approximate: the value a series carries at its first export is not counted.'
    type: stat
    gridPos:
      x: 16
      y: 0
      w: 8
      h: 4
    datasource:
      type: prometheus
      uid: ${ds_metrics}
    interval: 1m
    fieldConfig:
      defaults:
        unit: short
        thresholds:
          mode: absolute
          steps:
          - color: green
            value: null
          - color: orange
            value: 1
      overrides: []
    targets:
    - datasource:
        type: prometheus
        uid: ${ds_metrics}
      editorMode: code
      expr: sum(increase(scheduler_notifications_retried_total{job="${namespace}/${service}", deployment_environment_name=~"${env:regex}", kind=~"${kind:regex}"}[$__range]))
        or vector(0)
      legendFormat: ''
      instant: true
      range: false
      format: time_series
      exemplar: false
      refId: A
      interval: 1m
    options:
      colorMode: background
      graphMode: none
      textMode: auto
      reduceOptions:
        calcs:
        - lastNotNull
        fields: ''
        values: false
  - id: 4
    title: Sent, failed and retried by kind
    description: Production dispatch is disabled (Enabled=false, Provider=None) until the Cloudflare adapter/configuration lands; outbox rows are still written. Rates
      by BookingConfirmation or Cancellation. The kind picker uses the bounded enum so a never-fired sent counter does not hide pending kinds.
    type: timeseries
    gridPos:
      x: 0
      y: 4
      w: 24
      h: 7
    datasource:
      type: prometheus
      uid: ${ds_metrics}
    interval: 1m
    fieldConfig:
      defaults:
        unit: ops
        thresholds:
          mode: absolute
          steps:
          - color: green
            value: null
        custom:
          drawStyle: line
          lineWidth: 2
          fillOpacity: 0
          showPoints: never
          spanNulls: false
          stacking:
            mode: none
            group: A
          thresholdsStyle:
            mode: 'off'
      overrides: []
    targets:
    - datasource:
        type: prometheus
        uid: ${ds_metrics}
      editorMode: code
      expr: sum by (kind) (rate(scheduler_notifications_sent_total{job="${namespace}/${service}", deployment_environment_name=~"${env:regex}", kind=~"${kind:regex}"}[$__rate_interval]))
      legendFormat: sent {{kind}}
      instant: false
      range: true
      format: time_series
      exemplar: false
      refId: A
      interval: 1m
    - datasource:
        type: prometheus
        uid: ${ds_metrics}
      editorMode: code
      expr: sum by (kind) (rate(scheduler_notifications_failed_total{job="${namespace}/${service}", deployment_environment_name=~"${env:regex}", kind=~"${kind:regex}"}[$__rate_interval]))
      legendFormat: failed {{kind}}
      instant: false
      range: true
      format: time_series
      exemplar: false
      refId: B
      interval: 1m
    - datasource:
        type: prometheus
        uid: ${ds_metrics}
      editorMode: code
      expr: sum by (kind) (rate(scheduler_notifications_retried_total{job="${namespace}/${service}", deployment_environment_name=~"${env:regex}", kind=~"${kind:regex}"}[$__rate_interval]))
      legendFormat: retried {{kind}}
      instant: false
      range: true
      format: time_series
      exemplar: false
      refId: C
      interval: 1m
    options:
      legend:
        displayMode: list
        placement: bottom
        calcs: []
      tooltip:
        mode: multi
        sort: desc
  - id: 5
    title: Outbox pending depth
    description: Production dispatch is disabled (Enabled=false, Provider=None) until the Cloudflare adapter/configuration lands; outbox rows are still written. G2
      gauge, declared in Infrastructure InfrastructureTelemetry.cs. No data means a failed or missing observation; do not read it as an empty queue. Counts must include
      future retries and leased Pending rows. Sum assumes one active reporting API instance; replicated database-wide gauges must not be summed.
    type: timeseries
    gridPos:
      x: 0
      y: 11
      w: 12
      h: 7
    datasource:
      type: prometheus
      uid: ${ds_metrics}
    interval: 1m
    fieldConfig:
      defaults:
        unit: short
        thresholds:
          mode: absolute
          steps:
          - color: green
            value: null
          - color: orange
            value: 1
        custom:
          drawStyle: line
          lineWidth: 2
          fillOpacity: 0
          showPoints: never
          spanNulls: false
          stacking:
            mode: none
            group: A
          thresholdsStyle:
            mode: line
      overrides: []
    targets:
    - datasource:
        type: prometheus
        uid: ${ds_metrics}
      editorMode: code
      expr: sum by (kind) (scheduler_notifications_outbox_pending{job="${namespace}/${service}", deployment_environment_name=~"${env:regex}", kind=~"${kind:regex}"})
      legendFormat: '{{kind}}'
      instant: false
      range: true
      format: time_series
      exemplar: false
      refId: A
      interval: 1m
    options:
      legend:
        displayMode: list
        placement: bottom
        calcs: []
      tooltip:
        mode: multi
        sort: desc
  - id: 6
    title: Oldest pending age
    description: Production dispatch is disabled (Enabled=false, Provider=None) until the Cloudflare adapter/configuration lands; outbox rows are still written. Task
      19 G2 names this scheduler.notifications.oldest_pending_age (seconds), superseding the plan's outbox_oldest_pending_age spelling. Gauge must refresh even with
      sending disabled. Declared in Infrastructure InfrastructureTelemetry.cs, 0 when nothing is Pending. No data is an observation gap, not 0.
    type: timeseries
    gridPos:
      x: 12
      y: 11
      w: 12
      h: 7
    datasource:
      type: prometheus
      uid: ${ds_metrics}
    interval: 1m
    fieldConfig:
      defaults:
        unit: s
        thresholds:
          mode: absolute
          steps:
          - color: green
            value: null
          - color: red
            value: 300
        custom:
          drawStyle: line
          lineWidth: 2
          fillOpacity: 0
          showPoints: never
          spanNulls: false
          stacking:
            mode: none
            group: A
          thresholdsStyle:
            mode: line
      overrides: []
    targets:
    - datasource:
        type: prometheus
        uid: ${ds_metrics}
      editorMode: code
      expr: max(scheduler_notifications_oldest_pending_age_seconds{job="${namespace}/${service}", deployment_environment_name=~"${env:regex}"})
      legendFormat: oldest pending
      instant: false
      range: true
      format: time_series
      exemplar: false
      refId: A
      interval: 1m
    options:
      legend:
        displayMode: list
        placement: bottom
        calcs: []
      tooltip:
        mode: multi
        sort: desc
  - id: 7
    title: Outbox age at send attempt, p50 and p95
    description: Production dispatch is disabled (Enabled=false, Provider=None) until the Cloudflare adapter/configuration lands; outbox rows are still written. Histogram
      is recorded only when attempting a send. A stalled dispatcher can leave it empty while pending depth and oldest age rise.
    type: timeseries
    gridPos:
      x: 0
      y: 18
      w: 12
      h: 7
    datasource:
      type: prometheus
      uid: ${ds_metrics}
    interval: 1m
    fieldConfig:
      defaults:
        unit: s
        thresholds:
          mode: absolute
          steps:
          - color: green
            value: null
          - color: red
            value: 300
        custom:
          drawStyle: line
          lineWidth: 2
          fillOpacity: 0
          showPoints: never
          spanNulls: false
          stacking:
            mode: none
            group: A
          thresholdsStyle:
            mode: line
      overrides: []
    targets:
    - datasource:
        type: prometheus
        uid: ${ds_metrics}
      editorMode: code
      expr: histogram_quantile(0.5, sum by (le, kind) (rate(scheduler_notifications_outbox_age_seconds_bucket{job="${namespace}/${service}", deployment_environment_name=~"${env:regex}",
        kind=~"${kind:regex}"}[$__rate_interval])))
      legendFormat: p50 {{kind}}
      instant: false
      range: true
      format: time_series
      exemplar: false
      refId: A
      interval: 1m
    - datasource:
        type: prometheus
        uid: ${ds_metrics}
      editorMode: code
      expr: histogram_quantile(0.95, sum by (le, kind) (rate(scheduler_notifications_outbox_age_seconds_bucket{job="${namespace}/${service}", deployment_environment_name=~"${env:regex}",
        kind=~"${kind:regex}"}[$__rate_interval])))
      legendFormat: p95 {{kind}}
      instant: false
      range: true
      format: time_series
      exemplar: false
      refId: B
      interval: 1m
    options:
      legend:
        displayMode: list
        placement: bottom
        calcs: []
      tooltip:
        mode: multi
        sort: desc
  - id: 8
    title: Provider send duration p95
    description: Production dispatch is disabled (Enabled=false, Provider=None) until the Cloudflare adapter/configuration lands; outbox rows are still written. Elapsed
      provider attempt time via Stopwatch. It does not include time waiting in the outbox or provider inbox delivery.
    type: timeseries
    gridPos:
      x: 12
      y: 18
      w: 12
      h: 7
    datasource:
      type: prometheus
      uid: ${ds_metrics}
    interval: 1m
    fieldConfig:
      defaults:
        unit: ms
        thresholds:
          mode: absolute
          steps:
          - color: green
            value: null
        custom:
          drawStyle: line
          lineWidth: 2
          fillOpacity: 0
          showPoints: never
          spanNulls: false
          stacking:
            mode: none
            group: A
          thresholdsStyle:
            mode: 'off'
      overrides: []
    targets:
    - datasource:
        type: prometheus
        uid: ${ds_metrics}
      editorMode: code
      expr: histogram_quantile(0.95, sum by (le, kind) (rate(scheduler_notifications_dispatch_duration_milliseconds_bucket{job="${namespace}/${service}", deployment_environment_name=~"${env:regex}",
        kind=~"${kind:regex}"}[$__rate_interval])))
      legendFormat: p95 {{kind}}
      instant: false
      range: true
      format: time_series
      exemplar: false
      refId: A
      interval: 1m
    options:
      legend:
        displayMode: list
        placement: bottom
        calcs: []
      tooltip:
        mode: multi
        sort: desc
  - id: 9
    title: Enqueued minus finished in range (approx.)
    description: 'Production dispatch is disabled (Enabled=false, Provider=None) until the Cloudflare adapter/configuration lands; outbox rows are still written.
      All kinds regardless of the kind filter. Difference of range increases, not queue depth: rows pending before the range are excluded and completions can make
      it negative. Missing never-fired counters are 0; reset and first-export effects remain.'
    type: stat
    gridPos:
      x: 0
      y: 25
      w: 24
      h: 4
    datasource:
      type: prometheus
      uid: ${ds_metrics}
    interval: 1m
    fieldConfig:
      defaults:
        unit: short
        thresholds:
          mode: absolute
          steps:
          - color: green
            value: null
      overrides: []
    targets:
    - datasource:
        type: prometheus
        uid: ${ds_metrics}
      editorMode: code
      expr: (sum(increase(scheduler_booking_requests_total{job="${namespace}/${service}", deployment_environment_name=~"${env:regex}", outcome="confirmed"}[$__range]))
        or vector(0)) + (sum(increase(scheduler_appointments_cancellations_total{job="${namespace}/${service}", deployment_environment_name=~"${env:regex}"}[$__range]))
        or vector(0)) - (sum(increase(scheduler_notifications_sent_total{job="${namespace}/${service}", deployment_environment_name=~"${env:regex}"}[$__range])) or
        vector(0)) - (sum(increase(scheduler_notifications_failed_total{job="${namespace}/${service}", deployment_environment_name=~"${env:regex}"}[$__range])) or
        vector(0))
      legendFormat: ''
      instant: true
      range: false
      format: time_series
      exemplar: false
      refId: A
      interval: 1m
    options:
      colorMode: background
      graphMode: none
      textMode: auto
      reduceOptions:
        calcs:
        - lastNotNull
        fields: ''
        values: false
  - id: 10
    title: Retries, dead letters and cycle failures
    description: Production dispatch is disabled (Enabled=false, Provider=None) until the Cloudflare adapter/configuration lands; outbox rows are still written. Message
      text for notification events 1301 NotificationRetried, 1302 NotificationFailed, 1303 NotificationDispatchCycleFailed and 1304 NotificationClaimLost; no
      recipient filter or dimension. The filter matches their message text in Infrastructure InfrastructureLog.
    type: logs
    gridPos:
      x: 0
      y: 29
      w: 24
      h: 8
    datasource:
      type: loki
      uid: ${ds_logs}
    interval: 1m
    fieldConfig:
      defaults:
        unit: none
        thresholds:
          mode: absolute
          steps:
          - color: green
            value: null
      overrides: []
    targets:
    - datasource:
        type: loki
        uid: ${ds_logs}
      expr: '{service_name=~"${service:regex}", service_namespace="${namespace}", deployment_environment_name=~"${env:regex}"} |~ "failed attempt|dead letter|dispatch
        cycle failed|acknowledgement ignored"'
      queryType: range
      maxLines: 100
      refId: A
    options:
      showTime: true
      showLabels: false
      showCommonLabels: false
      wrapLogMessage: true
      sortOrder: Descending
      enableLogDetails: true
      dedupStrategy: none
