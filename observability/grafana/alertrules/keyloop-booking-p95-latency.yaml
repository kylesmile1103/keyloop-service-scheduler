apiVersion: rules.alerting.grafana.app/v0alpha1
kind: AlertRule
metadata:
  name: keyloop-booking-p95-latency
  annotations:
    grafana.app/folder: keyloop-service-scheduler
spec:
  title: Booking p95 above 300 ms
  paused: false
  trigger:
    interval: 1m
  for: 5m
  noDataState: Ok
  execErrState: Error
  labels:
    service: keyloop-scheduler-api
    environment: ${ENVIRONMENT}
    severity: page
  annotations:
    summary: Booking p95 exceeds 300 ms for 5 minutes with traffic.
    description: Traffic gate is greater than 0.02 bookings/second (about 6 per 5 minutes). Check lock wait and database latency. Quantile interpolation remains imprecise
      until G1 lands.
    runbook_url: ${RUNBOOK_BASE_URL}#booking-latency
    __dashboardUid__: keyloop-booking-engine
    __panelId__: '10'
  panelRef:
    dashboardUID: keyloop-booking-engine
    panelID: 10
  notificationSettings:
    type: SimplifiedRouting
    receiver: ${ALERT_RECEIVER}
  expressions:
    A:
      datasourceUID: ${METRICS_DATASOURCE_UID}
      relativeTimeRange:
        from: 5m
        to: 0s
      model:
        refId: A
        datasource:
          type: prometheus
          uid: ${METRICS_DATASOURCE_UID}
        editorMode: code
        instant: true
        range: false
        expr: histogram_quantile(0.95, sum by (le) (rate(scheduler_booking_duration_milliseconds_bucket{job="${API_JOB}", deployment_environment_name="${ENVIRONMENT}"}[5m])))
        intervalMs: 60000
        maxDataPoints: 43200
    C:
      source: true
      model:
        refId: C
        type: math
        expression: $A > 300 && $B > 0.02
    B:
      datasourceUID: ${METRICS_DATASOURCE_UID}
      relativeTimeRange:
        from: 5m
        to: 0s
      model:
        refId: B
        datasource:
          type: prometheus
          uid: ${METRICS_DATASOURCE_UID}
        editorMode: code
        instant: true
        range: false
        expr: sum(rate(scheduler_booking_duration_milliseconds_count{job="${API_JOB}", deployment_environment_name="${ENVIRONMENT}"}[5m]))
        intervalMs: 60000
        maxDataPoints: 43200
