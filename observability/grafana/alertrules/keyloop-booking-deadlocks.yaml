apiVersion: rules.alerting.grafana.app/v0alpha1
kind: AlertRule
metadata:
  name: keyloop-booking-deadlocks
  annotations:
    grafana.app/folder: keyloop-service-scheduler
spec:
  title: Booking deadlock detected
  paused: false
  trigger:
    interval: 1m
  for: 0s
  noDataState: Ok
  execErrState: Error
  labels:
    service: keyloop-scheduler-api
    environment: ${ENVIRONMENT}
    severity: page
  annotations:
    summary: A booking transaction hit PostgreSQL 40P01.
    description: ADR-003 requires one advisory lock and no second contended operation. Inspect event 1004 and the transaction span; never loosen the exclusion constraints.
    runbook_url: ${RUNBOOK_BASE_URL}#booking-deadlocks
    __dashboardUid__: keyloop-booking-engine
    __panelId__: '1'
  panelRef:
    dashboardUID: keyloop-booking-engine
    panelID: 1
  notificationSettings:
    type: SimplifiedRouting
    receiver: ${ALERT_RECEIVER}
  expressions:
    A:
      datasourceUID: ${METRICS_DATASOURCE_UID}
      relativeTimeRange:
        from: 10m
        to: 0s
      model:
        refId: A
        datasource:
          type: prometheus
          uid: ${METRICS_DATASOURCE_UID}
        editorMode: code
        instant: true
        range: false
        expr: sum((increase(scheduler_booking_deadlocks_total{job="${API_JOB}", deployment_environment_name="${ENVIRONMENT}"}[10m]) and scheduler_booking_deadlocks_total{job="${API_JOB}",
          deployment_environment_name="${ENVIRONMENT}"} offset 10m) or (max_over_time(scheduler_booking_deadlocks_total{job="${API_JOB}", deployment_environment_name="${ENVIRONMENT}"}[10m])
          unless scheduler_booking_deadlocks_total{job="${API_JOB}", deployment_environment_name="${ENVIRONMENT}"} offset 10m)) or vector(0)
        intervalMs: 60000
        maxDataPoints: 43200
    C:
      source: true
      model:
        refId: C
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
          operator:
            type: and
          query:
            params:
            - C
          reducer:
            type: last
            params: []
          type: query
