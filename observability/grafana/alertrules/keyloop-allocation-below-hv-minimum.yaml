apiVersion: rules.alerting.grafana.app/v0alpha1
kind: AlertRule
metadata:
  name: keyloop-allocation-below-hv-minimum
  annotations:
    grafana.app/folder: keyloop-service-scheduler
spec:
  title: Allocation below required HV competence
  paused: false
  trigger:
    interval: 1m
  for: 0s
  noDataState: Ok
  execErrState: Error
  labels:
    service: keyloop-scheduler-api
    environment: ${ENVIRONMENT}
    severity: page
  annotations:
    summary: An allocation selected a technician below the resolved HV minimum.
    description: ADR-029 requires qualified allocation. Inspect critical event 1020, policy version, fired rules and local-date expiry. Stop affected bookings until the qualification defect is corrected.
    runbook_url: ${RUNBOOK_BASE_URL}#allocation-below-hv-minimum
    __dashboardUid__: keyloop-booking-engine
    __panelId__: '1'
  panelRef:
    dashboardUID: keyloop-booking-engine
    panelID: 1
  notificationSettings:
    type: SimplifiedRouting
    receiver: ${ALERT_RECEIVER}
  expressions:
    A:
      datasourceUID: ${METRICS_DATASOURCE_UID}
      relativeTimeRange:
        from: 10m
        to: 0s
      model:
        refId: A
        datasource:
          type: prometheus
          uid: ${METRICS_DATASOURCE_UID}
        editorMode: code
        instant: true
        range: false
        expr: sum((increase(scheduler_allocation_below_hv_minimum_total{job="${API_JOB}", deployment_environment_name="${ENVIRONMENT}"}[10m]) and scheduler_allocation_below_hv_minimum_total{job="${API_JOB}",
          deployment_environment_name="${ENVIRONMENT}"} offset 10m) or (max_over_time(scheduler_allocation_below_hv_minimum_total{job="${API_JOB}", deployment_environment_name="${ENVIRONMENT}"}[10m])
          unless scheduler_allocation_below_hv_minimum_total{job="${API_JOB}", deployment_environment_name="${ENVIRONMENT}"} offset 10m)) or vector(0)
        intervalMs: 60000
        maxDataPoints: 43200
    C:
      source: true
      model:
        refId: C
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
          operator:
            type: and
          query:
            params:
            - C
          reducer:
            type: last
            params: []
          type: query
