apiVersion: rules.alerting.grafana.app/v0alpha1
kind: AlertRule
metadata:
  name: keyloop-notifications-dead-letters
  annotations:
    grafana.app/folder: keyloop-service-scheduler
spec:
  title: Notification dead letter
  paused: false
  trigger:
    interval: 1m
  for: 0s
  noDataState: Ok
  execErrState: Error
  labels:
    service: keyloop-scheduler-api
    environment: ${ENVIRONMENT}
    severity: ticket
  annotations:
    summary: A customer notification exhausted its attempts and was dead-lettered.
    description: 'ARCHITECTURE section 12.3: investigate dead letters and sender configuration. Inspect event 1302 NotificationFailed and the outbox id; do not resend blindly, a lost
      provider acknowledgement can already mean the message was sent.'
    runbook_url: ${RUNBOOK_BASE_URL}#notification-dead-letters
    __dashboardUid__: keyloop-notifications
    __panelId__: '1'
  panelRef:
    dashboardUID: keyloop-notifications
    panelID: 1
  notificationSettings:
    type: SimplifiedRouting
    receiver: ${ALERT_RECEIVER}
  expressions:
    A:
      datasourceUID: ${METRICS_DATASOURCE_UID}
      relativeTimeRange:
        from: 15m
        to: 0s
      model:
        refId: A
        datasource:
          type: prometheus
          uid: ${METRICS_DATASOURCE_UID}
        editorMode: code
        instant: true
        range: false
        expr: sum by (kind) ((increase(scheduler_notifications_failed_total{job="${API_JOB}", deployment_environment_name="${ENVIRONMENT}"}[15m]) and scheduler_notifications_failed_total{job="${API_JOB}",
          deployment_environment_name="${ENVIRONMENT}"} offset 15m) or (max_over_time(scheduler_notifications_failed_total{job="${API_JOB}", deployment_environment_name="${ENVIRONMENT}"}[15m])
          unless scheduler_notifications_failed_total{job="${API_JOB}", deployment_environment_name="${ENVIRONMENT}"} offset 15m)) or on() vector(0)
        intervalMs: 60000
        maxDataPoints: 43200
    C:
      source: true
      model:
        refId: C
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
          operator:
            type: and
          query:
            params:
            - C
          reducer:
            type: last
            params: []
          type: query
