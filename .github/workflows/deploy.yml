name: Deploy public demo

on:
  workflow_dispatch:
    inputs:
      migrate:
        description: Apply pending EF migrations and runtime grants before deploying
        type: boolean
        default: false
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  CI: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  CF_SEND_TELEMETRY: 'false'
  WRANGLER_SEND_METRICS: 'false'
  CLOUDFLARE_SEND_METRICS: 'false'

jobs:
  plan:
    # Main-only environment without reviewers; its separate token permits registry push and instance read.
    # Workers deploy and Secrets Store permissions belong only to the production token.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.path == '.github/workflows/ci.yml' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: plan
    permissions:
      contents: read
      actions: read # Check CI evidence and the repository's production reviewer rule.
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
      tag: ${{ steps.commit.outputs.tag }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      KEYLOOP_SECRETS_STORE_ID: ${{ secrets.KEYLOOP_SECRETS_STORE_ID }}
      KEYLOOP_ACCESS_AUDIENCE: ${{ secrets.KEYLOOP_ACCESS_AUDIENCE }}
      KEYLOOP_ACCESS_ADMIN: ${{ secrets.KEYLOOP_ACCESS_ADMIN }}
      KEYLOOP_ACCESS_SERVICE_ADVISOR: ${{ secrets.KEYLOOP_ACCESS_SERVICE_ADVISOR }}
      KEYLOOP_ACCESS_VIEWER: ${{ secrets.KEYLOOP_ACCESS_VIEWER }}
      KEYLOOP_TRIAGE_ACCOUNT_ID: ${{ secrets.KEYLOOP_TRIAGE_ACCOUNT_ID }}
      KEYLOOP_EMAIL_ACCOUNT_ID: ${{ secrets.KEYLOOP_EMAIL_ACCOUNT_ID }}
      KEYLOOP_EMAIL_ALLOWED_ADDRESSES: ${{ secrets.KEYLOOP_EMAIL_ALLOWED_ADDRESSES }}
      KEYLOOP_EMAIL_ALLOWED_DOMAINS: ${{ secrets.KEYLOOP_EMAIL_ALLOWED_DOMAINS }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - name: Confirm current main and successful CI for this exact SHA
        id: commit
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER: ${{ github.event_name }}
        run: |
          bash deploy/cloudflare/scripts/check-main-sha.sh
          gh api "repos/$GITHUB_REPOSITORY/environments/production" \
            | jq -e 'any(.protection_rules[]; .type == "required_reviewers" and (.reviewers | length > 0))' \
              > /dev/null || { echo 'Configure production required reviewers before planning a deployment.' >&2; exit 1; }
          sha=$(git rev-parse HEAD)
          if [[ "$TRIGGER" == workflow_dispatch ]]; then
            gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$sha&branch=main&status=completed&per_page=100" \
              | jq -e --arg sha "$sha" --arg repo "$GITHUB_REPOSITORY" '
                  any(.workflow_runs[]; .head_sha == $sha and .head_branch == "main" and
                    .head_repository.full_name == $repo and .event == "push" and .conclusion == "success")
                ' > /dev/null || { echo 'This SHA has no successful main CI run.' >&2; exit 1; }
          fi
          printf 'sha=%s\ntag=%s\n' "$sha" "${sha:0:12}" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: src/Keyloop.ServiceScheduler.Web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
          cache: pnpm
          cache-dependency-path: src/Keyloop.ServiceScheduler.Web/pnpm-lock.yaml
      - name: Build the API image natively for linux/amd64
        env:
          IMAGE_TAG: ${{ steps.commit.outputs.tag }}
        run: |
          test "$(uname -m)" = x86_64
          docker buildx build --platform linux/amd64 --provenance=false --sbom=false \
            -f src/Keyloop.ServiceScheduler.Api/Dockerfile \
            -t "keyloop-scheduler-api:$IMAGE_TAG" --load .
      - name: Push the build image to Cloudflare registry (no rollout)
        working-directory: deploy/cloudflare
        env:
          IMAGE_TAG: ${{ steps.commit.outputs.tag }}
        run: |
          npm ci --no-audit --no-fund
          mkdir -p build
          # A push needs no Worker configuration. Run it outside the project, or cf evaluates cloudflare.config.ts,
          # which requires the build variables that only the build step reads.
          cf="$PWD/node_modules/.bin/cf"
          if ! (cd "$RUNNER_TEMP" && "$cf" containers push --tag "keyloop-scheduler-api:$IMAGE_TAG") > build/github-push.log 2>&1; then
            echo 'Registry push failed. Output with identifiers removed:' >&2
            bash scripts/print-redacted-error.sh build/github-push.log
            exit 1
          fi
      - name: Build the SPA and edge for the checked SHA
        # Read environment variables on the runner after plan is declared.
        env:
          KEYLOOP_ACCESS_TEAM_DOMAIN: ${{ vars.KEYLOOP_ACCESS_TEAM_DOMAIN }}
          KEYLOOP_TRIAGE_ENABLED: ${{ vars.KEYLOOP_TRIAGE_ENABLED }}
          KEYLOOP_TRIAGE_GATEWAY_ID: ${{ vars.KEYLOOP_TRIAGE_GATEWAY_ID }}
          KEYLOOP_TRIAGE_BUCKET: ${{ vars.KEYLOOP_TRIAGE_BUCKET }}
          KEYLOOP_VEHICLE_AWARE_REQUIREMENTS: ${{ vars.KEYLOOP_VEHICLE_AWARE_REQUIREMENTS }}
          KEYLOOP_API_OTLP_ENABLED: ${{ vars.KEYLOOP_API_OTLP_ENABLED }}
          KEYLOOP_GRAFANA_OTLP_ENDPOINT: ${{ vars.KEYLOOP_GRAFANA_OTLP_ENDPOINT }}
          KEYLOOP_GRAFANA_INSTANCE_ID: ${{ vars.KEYLOOP_GRAFANA_INSTANCE_ID }}
          KEYLOOP_NOTIFICATIONS_ENABLED: ${{ vars.KEYLOOP_NOTIFICATIONS_ENABLED }}
          KEYLOOP_EMAIL_SENDING_ENABLED: ${{ vars.KEYLOOP_EMAIL_SENDING_ENABLED }}
          KEYLOOP_OTLP_RELAY_ENABLED: ${{ vars.KEYLOOP_OTLP_RELAY_ENABLED }}
          KEYLOOP_EMAIL_TRANSPORT: ${{ vars.KEYLOOP_EMAIL_TRANSPORT }}
          KEYLOOP_EMAIL_MAX_PER_RECIPIENT_PER_DAY: ${{ vars.KEYLOOP_EMAIL_MAX_PER_RECIPIENT_PER_DAY }}
          KEYLOOP_EMAIL_MAX_PER_DAY: ${{ vars.KEYLOOP_EMAIL_MAX_PER_DAY }}
        run: bash deploy/cloudflare/scripts/build-github-edge.sh
      - name: Validate prebuilt deployment and write safe plan summary
        working-directory: deploy/cloudflare
        env:
          DEPLOY_SHA: ${{ steps.commit.outputs.sha }}
          IMAGE_TAG: ${{ steps.commit.outputs.tag }}
        run: |
          if ! node_modules/.bin/cf deploy --prebuilt --provision=false --dry-run > build/github-dry-run.log 2>&1; then
            echo 'Deployment dry run failed. Output with identifiers removed:' >&2
            bash scripts/print-redacted-error.sh build/github-dry-run.log
            exit 1
          fi
          node scripts/github-plan-summary.mjs
      - name: Remove private build output and logs
        if: always()
        run: rm -rf deploy/cloudflare/.cloudflare/output deploy/cloudflare/build

  migrate:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.migrate }}
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - name: Reject a commit superseded while waiting for approval
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash deploy/cloudflare/scripts/check-main-sha.sh
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Build the pinned EF migration bundle
        env:
          KEYLOOP_BUILD_MIGRATION_BUNDLE: 'true'
        run: |
          dotnet tool restore
          # dotnet ef reads the projects' metadata before it builds, which needs restored assets in a fresh checkout.
          dotnet restore src/Keyloop.ServiceScheduler.Api
          mkdir -p artifacts
          dotnet ef migrations bundle --project src/Keyloop.ServiceScheduler.Infrastructure \
            --startup-project src/Keyloop.ServiceScheduler.Api --configuration Release \
            --self-contained --target-runtime linux-x64 --output artifacts/keyloop-efbundle --force
          dotnet build deploy/neon/github-migrate -c Release -warnaserror
      - name: Install psql
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Apply pending migrations and idempotent runtime grants
        env:
          NEON_OWNER_CONNECTION: ${{ secrets.NEON_OWNER_CONNECTION }}
        run: >-
          dotnet run --project deploy/neon/github-migrate -c Release --no-build --
          artifacts/keyloop-efbundle deploy/neon/runtime-role.sql
      - name: Remove local migration bundle
        if: always()
        run: rm -rf artifacts

  deploy:
    needs: [plan, migrate]
    if: >-
      ${{ !cancelled() && needs.plan.result == 'success' &&
          (needs.migrate.result == 'success' || needs.migrate.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://keyloop.kylesmile.me
    outputs:
      vehicle-aware: ${{ steps.settings.outputs.vehicle-aware }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      KEYLOOP_SECRETS_STORE_ID: ${{ secrets.KEYLOOP_SECRETS_STORE_ID }}
      KEYLOOP_ACCESS_AUDIENCE: ${{ secrets.KEYLOOP_ACCESS_AUDIENCE }}
      KEYLOOP_ACCESS_ADMIN: ${{ secrets.KEYLOOP_ACCESS_ADMIN }}
      KEYLOOP_ACCESS_SERVICE_ADVISOR: ${{ secrets.KEYLOOP_ACCESS_SERVICE_ADVISOR }}
      KEYLOOP_ACCESS_VIEWER: ${{ secrets.KEYLOOP_ACCESS_VIEWER }}
      KEYLOOP_TRIAGE_ACCOUNT_ID: ${{ secrets.KEYLOOP_TRIAGE_ACCOUNT_ID }}
      KEYLOOP_EMAIL_ACCOUNT_ID: ${{ secrets.KEYLOOP_EMAIL_ACCOUNT_ID }}
      KEYLOOP_EMAIL_ALLOWED_ADDRESSES: ${{ secrets.KEYLOOP_EMAIL_ALLOWED_ADDRESSES }}
      KEYLOOP_EMAIL_ALLOWED_DOMAINS: ${{ secrets.KEYLOOP_EMAIL_ALLOWED_DOMAINS }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - name: Reject a commit superseded while waiting for approval
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash deploy/cloudflare/scripts/check-main-sha.sh
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: src/Keyloop.ServiceScheduler.Web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
          cache: pnpm
          cache-dependency-path: src/Keyloop.ServiceScheduler.Web/pnpm-lock.yaml
      - name: Rebuild the SPA and edge for the planned SHA
        # Environment vars are evaluated on the runner after production approval.
        env:
          KEYLOOP_ACCESS_TEAM_DOMAIN: ${{ vars.KEYLOOP_ACCESS_TEAM_DOMAIN }}
          KEYLOOP_TRIAGE_ENABLED: ${{ vars.KEYLOOP_TRIAGE_ENABLED }}
          KEYLOOP_TRIAGE_GATEWAY_ID: ${{ vars.KEYLOOP_TRIAGE_GATEWAY_ID }}
          KEYLOOP_TRIAGE_BUCKET: ${{ vars.KEYLOOP_TRIAGE_BUCKET }}
          KEYLOOP_VEHICLE_AWARE_REQUIREMENTS: ${{ vars.KEYLOOP_VEHICLE_AWARE_REQUIREMENTS }}
          KEYLOOP_API_OTLP_ENABLED: ${{ vars.KEYLOOP_API_OTLP_ENABLED }}
          KEYLOOP_GRAFANA_OTLP_ENDPOINT: ${{ vars.KEYLOOP_GRAFANA_OTLP_ENDPOINT }}
          KEYLOOP_GRAFANA_INSTANCE_ID: ${{ vars.KEYLOOP_GRAFANA_INSTANCE_ID }}
          KEYLOOP_NOTIFICATIONS_ENABLED: ${{ vars.KEYLOOP_NOTIFICATIONS_ENABLED }}
          KEYLOOP_EMAIL_SENDING_ENABLED: ${{ vars.KEYLOOP_EMAIL_SENDING_ENABLED }}
          KEYLOOP_OTLP_RELAY_ENABLED: ${{ vars.KEYLOOP_OTLP_RELAY_ENABLED }}
          KEYLOOP_EMAIL_TRANSPORT: ${{ vars.KEYLOOP_EMAIL_TRANSPORT }}
          KEYLOOP_EMAIL_MAX_PER_RECIPIENT_PER_DAY: ${{ vars.KEYLOOP_EMAIL_MAX_PER_RECIPIENT_PER_DAY }}
          KEYLOOP_EMAIL_MAX_PER_DAY: ${{ vars.KEYLOOP_EMAIL_MAX_PER_DAY }}
        run: bash deploy/cloudflare/scripts/build-github-edge.sh
      - name: Deploy exactly this job's prebuilt output
        working-directory: deploy/cloudflare
        env:
          DEPLOY_SHA: ${{ needs.plan.outputs.sha }}
        run: |
          if ! node_modules/.bin/cf deploy --prebuilt --provision=false \
              --message "$DEPLOY_SHA via GitHub Actions run $GITHUB_RUN_ID" > build/github-deploy.log 2>&1; then
            echo 'Production deploy failed. Output with identifiers removed:' >&2
            bash scripts/print-redacted-error.sh build/github-deploy.log
            exit 1
          fi
      - name: Record the expected public flag
        id: settings
        env:
          KEYLOOP_VEHICLE_AWARE_REQUIREMENTS: ${{ vars.KEYLOOP_VEHICLE_AWARE_REQUIREMENTS }}
        run: printf 'vehicle-aware=%s\n' "${KEYLOOP_VEHICLE_AWARE_REQUIREMENTS:-false}" >> "$GITHUB_OUTPUT"
      - name: Remove private build output and logs
        if: always()
        run: rm -rf deploy/cloudflare/.cloudflare/output deploy/cloudflare/build

  verify:
    needs: [plan, deploy]
    # An explicit condition: without one, the implicit success() skips this job whenever migrate (an ancestor through deploy) was skipped.
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.deploy.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: plan
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      EXPECTED_VEHICLE_AWARE_REQUIREMENTS: ${{ needs.deploy.outputs.vehicle-aware }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
          cache: npm
          cache-dependency-path: deploy/cloudflare/package-lock.json
      - name: Install the pinned cf CLI
        working-directory: deploy/cloudflare
        run: npm ci --no-audit --no-fund
      - name: Verify live rollout and public demo (six-minute deadline)
        env:
          KEYLOOP_CONTAINER_APPLICATION_ID: ${{ vars.KEYLOOP_CONTAINER_APPLICATION_ID }}
        run: bash deploy/cloudflare/scripts/verify-github-deploy.sh
