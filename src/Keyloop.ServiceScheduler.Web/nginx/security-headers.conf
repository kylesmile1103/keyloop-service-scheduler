# Security headers for the static app (index.html and bundles). Included per location: nginx drops inherited add_header
# directives in any block that declares its own.
# CSP: scripts and fonts only from this origin (no inline script; the theme bootstrap is /theme-init.js); inline styles
# are allowed for the UI primitives' style attributes. connect-src 'self' covers the proxied /api; a production build
# that exports browser traces to a collector must add that collector's origin here.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# No HSTS: this container serves plain HTTP; HSTS belongs to the TLS terminator in front of it.
